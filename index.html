<script>

  // 日本: 攻撃の多い時間ほど明るく（地球儀の裏にあるときは描かない）
  if (!vis(TARGET[0], TARGET[1])) { ctx.globalCompositeOperation = "source-over"; return; }
  const R = Math.max(10, W * .012), gr = ctx.createRadialGradient(TX, TY, 0, TX, TY, R * (2.2 + glow * 2.5));
  gr.addColorStop(0, `rgba(255,255,255,${.25 + glow * .5})`); gr.addColorStop(.25, `rgba(159,200,255,${.12 + glow * .3})`); gr.addColorStop(1, "rgba(159,200,255,0)");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(TX, TY, R * (2.2 + glow * 2.5), 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
}
function drawCountries(dt) {   // 国の光（送信の強さ）と首都の光の柱
  lctx.clearRect(0, 0, W, Hh); lctx.globalCompositeOperation = "lighter";
  const k = Math.min(1, dt * 6), Lmax = Math.log1p(AMAX), ph = (PORTRAIT ? Hh * .16 : Hh * .26);
  for (let c = 0; c < NCT; c++) {
    SHOW[c] += (Math.min(1, Math.log1p(ACT[c]) / Lmax) - SHOW[c]) * k;
    const v = SHOW[c]; if (v < .03) continue;
    if (CPATH[c]) { lctx.fillStyle = `rgba(118,150,255,${(v * .6).toFixed(3)})`; lctx.fill(CPATH[c]); lctx.strokeStyle = `rgba(170,195,255,${(v * .5).toFixed(3)})`; lctx.lineWidth = .8; lctx.stroke(CPATH[c]); }
    const q = CXY[c]; if (!q) continue;
    if (PORTRAIT && d3.geoDistance(P.countries[c].slice(1), [-proj.rotate()[0], -proj.rotate()[1]]) > 1.5) continue;
    const x = q[0], y = q[1], hgt = 8 + Math.pow(v, 1.5) * ph, wd = 2 + v * 5;
    const g = lctx.createLinearGradient(x, y, x, y - hgt);
    g.addColorStop(0, `rgba(255,255,255,${(.45 + v * .55).toFixed(3)})`); g.addColorStop(.3, `rgba(160,195,255,${(.15 + v * .65).toFixed(3)})`); g.addColorStop(1, "rgba(150,190,255,0)");
    lctx.fillStyle = g; lctx.fillRect(x - wd / 2, y - hgt, wd, hgt);
    const bg = lctx.createLinearGradient(x, y, x, y - hgt * .7);
    bg.addColorStop(0, `rgba(120,160,255,${(v * .3).toFixed(3)})`); bg.addColorStop(1, "rgba(120,160,255,0)");
    lctx.fillStyle = bg; lctx.fillRect(x - wd * 3, y - hgt * .7, wd * 6, hgt * .7);
    const rg = lctx.createRadialGradient(x, y, 0, x, y, 4 + v * 14); rg.addColorStop(0, `rgba(255,255,255,${(.3 + v * .5).toFixed(3)})`); rg.addColorStop(1, "rgba(150,190,255,0)");
    lctx.fillStyle = rg; lctx.beginPath(); lctx.arc(x, y, 4 + v * 14, 0, 6.283); lctx.fill();
  }
  for (let k = 0; k < NG; k++) {   // 攻撃グループの星座
    GA[k] += ((GON[k] ? 1 : 0) - GA[k]) * Math.min(1, dt * 3);
    const a = GA[k]; if (a < .02) continue;
    const c = GPAL[k % GPAL.length], xy = GXY[k];
    for (const [w, al] of [[3.2, .12], [1.1, .6]]) {
      lctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${(al * a).toFixed(3)})`; lctx.lineWidth = w; lctx.stroke(GPATH[k]);
    }
    lctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${(.95 * a).toFixed(3)})`;
    for (const p of xy) { if (!p) continue; lctx.beginPath(); lctx.arc(p[0], p[1], 2.3, 0, 6.283); lctx.fill(); }
  }
  lctx.globalCompositeOperation = "source-over";
}
function drawGraph(h) {   // 直近 21 日の 1 時間ごとの増減（相対値・目盛りなし）
  const w = gC.width / DPR, hh = gC.height / DPR, N = 504, x0 = h - N + 1;
  gctx.clearRect(0, 0, w, hh);
  gctx.fillStyle = "rgba(76,201,240,.35)"; gctx.beginPath(); gctx.moveTo(0, hh);
  for (let i = 0; i < N; i++) { const v = x0 + i >= 0 ? P.bot[x0 + i] / 255 : 0; gctx.lineTo(i / (N - 1) * w, hh - v * hh * .95); }
  gctx.lineTo(w, hh); gctx.closePath(); gctx.fill();
  gctx.strokeStyle = "rgba(223,231,244,.85)"; gctx.lineWidth = 1.2; gctx.beginPath();
  for (let i = 0; i < N; i++) { const v = x0 + i >= 0 ? Math.sqrt(P.atk[x0 + i] / 255) : 0, x = i / (N - 1) * w, y = hh - v * hh * .95; i ? gctx.lineTo(x, y) : gctx.moveTo(x, y); }
  gctx.stroke();
  gctx.fillStyle = "#fff"; const ve = Math.sqrt(P.atk[h] / 255); gctx.beginPath(); gctx.arc(w - 2, hh - ve * hh * .95, 2.5, 0, 6.283); gctx.fill();
}
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!paused) {
    tAcc += dt * 1000;
    while (tAcc >= HOUR_MS && hCur < H - 1) { tAcc -= HOUR_MS; hCur++; spawnHour(hCur); }
    if (hCur >= H - 1 && (hold += dt) > 2.5) restart(false);
    if (hCur >= 0) drawGraph(hCur);
  }
  if (Math.abs(spin[0]) + Math.abs(spin[1]) > .002 && !drag) { ROT = [ROT[0] + spin[0] * dt * 1000, Math.max(-85, Math.min(85, ROT[1] + spin[1] * dt * 1000))]; spin = spin.map(v => v * Math.pow(.05, dt)); dirty = true; }
  if (dirty && PORTRAIT) { dirty = false; reproject(); }
  drawCountries(dt); draw(dt);
  requestAnimationFrame(frame);
}
const intro = document.getElementById("intro");
function playIntro(full, done) {
  intro.classList.remove("out", "on"); void intro.offsetWidth;
  requestAnimationFrame(() => intro.classList.add("on"));
  setTimeout(() => { intro.classList.add("out"); done(); }, full ? 4200 : 3000);
}
function restart(full) {
  paused = true; hold = 0; meteors = []; sparks = []; ACT.fill(0); GON.fill(0); GA.fill(0); capFor = -1; document.querySelectorAll(".cap").forEach(e => e.remove());
  const m = full && /^#h(\d+)$/.exec(location.hash);   // 確認用: #h<時> からはじめる
  playIntro(full, () => { hStart = m ? Math.min(H - 1, +m[1]) : 0; hCur = hStart - 1; tAcc = 0; paused = false; });
}
layout();
let rs; addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(layout, 120); });
// 地球儀は指（マウス）で回せる。離すと少し惰性で回る。動かさずに押したときだけ全画面
let drag = null, spin = [0, 0], dirty = false;
stage.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, r: ROT.slice(), t: performance.now(), lx: e.clientX, ly: e.clientY, moved: false }; spin = [0, 0]; try { stage.setPointerCapture(e.pointerId); } catch (_) {} });
stage.addEventListener("pointermove", e => {
  if (!drag || !PORTRAIT) return;
  const k = 57.3 / proj.scale(), now = performance.now(), dt = Math.max(1, now - drag.t);
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) drag.moved = true;
  ROT = [drag.r[0] + (e.clientX - drag.x) * k, Math.max(-85, Math.min(85, drag.r[1] - (e.clientY - drag.y) * k))];
  spin = [(e.clientX - drag.lx) * k / dt, -(e.clientY - drag.ly) * k / dt]; drag.lx = e.clientX; drag.ly = e.clientY; drag.t = now; dirty = true;
});
const endDrag = () => {
  if (!drag) return;
  if (!drag.moved) { spin = [0, 0]; try { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {} }
  else if (performance.now() - drag.t > 120) spin = [0, 0];
  drag = null;
};
stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
try { navigator.wakeLock?.request?.("screen").catch(() => {}); } catch (e) {}
restart(true);
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
